[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-di"
version = "1.0.0"
description = "Decision Intelligence platform for retail replenishment under censored demand, lead-time uncertainty, and working-capital constraints"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RetailPulse Engineering Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "SQLAlchemy>=2.0.25",
    "lightgbm>=4.3.0",
    "pulp>=2.8.0",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
